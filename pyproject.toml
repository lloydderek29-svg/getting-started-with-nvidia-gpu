[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpubook"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
  "nvidia-ml-py>=12.0",
  "pyyaml>=6.0",
]

[project.scripts]
gpubook-report = "gpubook.report:main"

[tool.setuptools.packages.find]
where = ["common/python"]

[tool.pytest.ini_options]
testpaths = ["chapters", "tests"]
pythonpath = [
  "chapters/ch06_vision/python",
  "chapters/ch08_generative/python",
  "chapters/ch10_triton/python",
]
markers = ["gpu: needs a CUDA GPU"]